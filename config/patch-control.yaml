# Control-plane role patch (applied to every controlplane node).
# Per-node hostname/IP settings live in patch-node.yaml.tftpl.
machine:
  kubelet:
    extraConfig:
      systemReserved:
        cpu: "200m"
        memory: "200Mi"
      kubeReserved:
        cpu: "100m"
        memory: "100Mi"
      evictionHard:
        memory.available: "200Mi"
